<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BinMart POS</title>
  </head>
  <body>
    <header class="topbar">
      <div class="page brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.65">
            <path d="M4 9.5h16l-1.4 10H5.4L4 9.5Z" stroke-linejoin="round"/>
            <path d="m8 9.5 4-5 4 5M10 13.2v2.7m4-2.7v2.7" stroke-linecap="round"/>
          </svg>
        </span>
        <span>BinMart <span class="brand-pos">POS</span></span>
      </div>
    </header>
    <main class="page">
      <h1>Quầy thu ngân</h1>
      <div class="workspace">
        <section aria-labelledby="catalog-title">
          <h2 id="catalog-title">Danh sách sản phẩm</h2>
          <div id="catalog" aria-busy="true"></div>
        </section>
        <section aria-labelledby="cart-title">
          <h2 id="cart-title">Giỏ hàng</h2>
          <div id="cart" aria-busy="true"></div>
        </section>
        <section aria-labelledby="checkout-title">
          <h2 id="checkout-title">Thanh toán</h2>
          <div id="checkout" aria-busy="true"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
